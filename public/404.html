<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Lista Piloto Candelário 2027</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Redirects 404 to index.html with path preservation
      var segmentCount = 1;
      var l = window.location;
      var pathname = l.pathname.split('/').slice(0, 1 + segmentCount).join('/');
      var search = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash;
      l.replace(
        l.protocol + '//' + l.host + pathname + '/?p=/' +
        l.pathname.slice(pathname.length).replace(/&/g, '~and~') +
        search + hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
